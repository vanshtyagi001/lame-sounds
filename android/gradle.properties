# Use Android Studio's bundled OpenJDK 21 (prevents Java 26 compatibility failure)
org.gradle.java.home=E:\\eSoftwares\\Android\\Android Studio\\jbr

# JVM memory allocation (prevents D8 / dexing java.lang.OutOfMemoryError)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC

# Modern Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Suppress compileSdk = 36 warning with AGP 8.7.3
android.suppressUnsupportedCompileSdk=36
